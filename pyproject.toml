[project]
name = "homefinder"
version = "0.1.0"
description = "Agentic PG / flat recommender for people moving to any Indian city (LangGraph + Streamlit)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-google-genai>=4.0",
    "tavily-python>=0.5",
    "streamlit>=1.35",
    "pydantic>=2.6",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
